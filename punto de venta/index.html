<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Punto de venta de On Coffee">
  <title>On Coffee | Punto de venta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/order.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/print.css">
</head>
<body>

<div id="app">
  <header>
    <div class="brand">
      <div class="brand-mark">☕</div>
      <div>
        <h1>On Coffee</h1>
        <div class="sub" id="dateSub"></div>
      </div>
    </div>
    <button class="edit-toggle" id="editToggle">Editar menú</button>
  </header>

  <main>
    <div class="menu-wrap">
      <div class="menu-scroll" id="menuScroll"></div>
    </div>

    <div class="order-panel">
      <div class="order-header"><h2>Pedido actual</h2></div>
      <div class="order-list" id="orderList"></div>
      <div class="total-strip">
        <div class="total-row">
          <span class="total-label">Subtotal</span>
          <span class="total-value" id="subtotalAmount">$0</span>
        </div>
        <div class="total-row tax-row">
          <span class="total-label">IVA Tijuana (8%)</span>
          <span class="total-value" id="ivaAmount">$0</span>
        </div>
        <div class="total-row total-final-row">
          <span class="total-label">Total a cobrar</span>
          <span class="total-amount" id="totalAmount">$0</span>
        </div>
      </div>
      <div class="order-footer">
        <button class="btn btn-secondary" id="printBtn" disabled>Pagar</button>
        <button class="btn btn-primary" id="newOrderBtn" disabled>Nuevo pedido</button>
      </div>
      <button class="report-btn" id="reportBtn">Descargar reporte Excel</button>
    </div>
  </main>
</div>

<div id="receipt"></div>

<div class="modal-overlay" id="milkOverlay">
  <div class="modal-card">
    <div class="modal-header">
      <h3 id="modalItemName"></h3>
      <div class="modal-price" id="modalItemPrice"></div>
    </div>
    <div id="milkOptions">
      <div class="modal-label">Tipo de leche</div>
      <div class="option-chips" id="milkChips"></div>
    </div>
    <div class="modal-label">¿Fría o caliente?</div>
    <div class="option-chips temperature-chips" id="temperatureChips"></div>
    <div class="modal-qty">
      <span>Cantidad</span>
      <div class="stepper">
        <button id="modalQtyMinus">−</button>
        <span id="modalQtyValue">1</span>
        <button id="modalQtyPlus">+</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="modalCancel">Cancelar</button>
      <button class="btn btn-primary" id="modalConfirm">Agregar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qz-tray@2.2.5/qz-tray.js"></script>
<script>
(function(){
  const CATEGORIES = [
    { id: 'barra', label: 'Barra tradicional', icon: '' },
    { id: 'lattes', label: 'Lattes', icon: '' },
    { id: 'especialidades', label: 'Especialidades', icon: '' },
    { id: 'tes', label: 'Tés y tisanas', icon: '' },
    { id: 'frappes', label: 'Frappes', icon: '' },
    { id: 'postres', label: 'Postres', icon: '' },
    { id: 'extras', label: 'Extras', icon: '' },
  ];

  const MILK_OPTIONS = [
    { id: 'entera', label: 'Entera' },
    { id: 'deslact', label: 'Deslactosada' },
    { id: 'avena', label: 'Avena' },
  ];

  const TEMPERATURE_OPTIONS = [
    { id: 'caliente', label: 'Caliente' },
    { id: 'fria', label: 'Fría' },
  ];
  const BEVERAGE_CATEGORIES = ['barra', 'lattes', 'especialidades', 'tes', 'frappes'];

  const DEFAULT_MENU = [
    { id: 'espresso', name: 'Espresso', price: 30, category: 'barra' },
    { id: 'espresso_cortado', name: 'Cortadito', price: 60, category: 'barra', hasMilk: true },
    { id: 'cappuccino', name: 'Cappuccino', price: 80, category: 'barra', hasMilk: true },
    { id: 'americano', name: 'Americano', price: 60, category: 'barra' },
    { id: 'latte_natural', name: 'Latte', price: 80, category: 'lattes', hasMilk: true },
    { id: 'mocha', name: 'Moka', price: 95, category: 'especialidades', hasMilk: true },
    { id: 'matcha_latte', name: 'Matcha', price: 100, category: 'especialidades', hasMilk: true },
    { id: 'chai_especias', name: 'Chai', price: 95, category: 'especialidades', hasMilk: true },
    { id: 'chocolate_on', name: 'Chocolate On', price: 95, category: 'especialidades', hasMilk: true },
    { id: 'dirty_chai', name: 'Dirty chai', price: 95, category: 'especialidades', hasMilk: true },
    { id: 'fresa_kiwi', name: 'Tisana de fresa kiwi', price: 95, category: 'tes' },
    { id: 'frutos_rojos', name: 'Tisana de frutos rojos', price: 95, category: 'tes' },
    { id: 'frappe_oreo', name: 'Frappe de Oreo', price: 120, category: 'frappes', hasMilk: true },
    { id: 'frappe_mazapan', name: 'Frappe de mazapán', price: 120, category: 'frappes', hasMilk: true },
    { id: 'frappe_moka', name: 'Frappe de Moka', price: 120, category: 'frappes', hasMilk: true },
    { id: 'frappe_caramelo', name: 'Frappe de caramelo', price: 120, category: 'frappes', hasMilk: true },
    { id: 'frappe_vainilla', name: 'Frappe de vainilla', price: 120, category: 'frappes', hasMilk: true },
    { id: 'pay_manzana', name: 'Pay de manzana', price: 25, category: 'postres' },
    { id: 'pastel_chocolate', name: 'Pastel de chocolate', price: 80, category: 'postres' },
    { id: 'muffin', name: 'Muffin', price: 55, category: 'postres' },
    { id: 'extra_macarrones', name: 'Macarrons', price: 25, category: 'postres' },
    { id: 'extra_galletas', name: 'Galletas', price: 25, category: 'postres' },
    { id: 'extra_cheesecake', name: 'Cheesecake', price: 80, category: 'postres' },
    { id: 'pan_muerto', name: 'Pan de muerto', price: 55, category: 'postres' },
    { id: 'extra_shot', name: 'Shot de espresso', price: 30, category: 'extras' },
    { id: 'extra_foam', name: 'Foam', price: 20, category: 'extras' },
    { id: 'extra_jarabe', name: 'Jarabes', price: 15, category: 'extras' },
    { id: 'extra_leche_avena', name: 'Leche de avena', price: 20, category: 'extras' },
  ];
  const MENU_VERSION = 11;

  let menu = [];
  let order = {};
  let editMode = false;
  let pendingItem = null;
  let pendingMilk = 'entera';
  let pendingTemperature = 'caliente';
  let pendingQty = 1;
  let activeSaleId = null;

  const menuScroll = document.getElementById('menuScroll');
  const orderList = document.getElementById('orderList');
  const totalAmount = document.getElementById('totalAmount');
  const newOrderBtn = document.getElementById('newOrderBtn');
  const printBtn = document.getElementById('printBtn');
  const reportBtn = document.getElementById('reportBtn');
  const subtotalAmount = document.getElementById('subtotalAmount');
  const ivaAmount = document.getElementById('ivaAmount');
  const editToggle = document.getElementById('editToggle');
  const dateSub = document.getElementById('dateSub');
  const receipt = document.getElementById('receipt');
  const milkOverlay = document.getElementById('milkOverlay');
  const modalItemName = document.getElementById('modalItemName');
  const modalItemPrice = document.getElementById('modalItemPrice');
  const milkChips = document.getElementById('milkChips');
  const milkOptions = document.getElementById('milkOptions');
  const temperatureChips = document.getElementById('temperatureChips');
  const modalQtyValue = document.getElementById('modalQtyValue');
  const IVA_RATE = 0.08;
  const OAT_MILK_EXTRA = 20;
  const LOGO_SRC = '../logo_negro_vaso_transparente.png';
  const SALES_KEY = 'sales';
  let saleLoggedForOrder = false;

  dateSub.textContent = new Date().toLocaleDateString('es-MX', { weekday:'long', day:'numeric', month:'long' });

  function fmt(n){
    return '$' + Number(n).toLocaleString('es-MX', { minimumFractionDigits: n % 1 !== 0 ? 2 : 0, maximumFractionDigits: 2 });
  }

  function calculateLineAmounts(item, amount){
    const includesIVA = ['barra', 'lattes', 'especialidades', 'frappes', 'postres', 'extras'].includes(item.category);
    if(includesIVA){
      const subtotal = amount / (1 + IVA_RATE);
      return { subtotal, iva: amount - subtotal, total: amount };
    }
    const iva = amount * IVA_RATE;
    return { subtotal: amount, iva, total: amount + iva };
  }

  function calculateOrderTotals(lines){
    return lines.reduce((totals, line) => {
      const amounts = calculateLineAmounts(line.item, line.amount);
      totals.subtotal += amounts.subtotal;
      totals.iva += amounts.iva;
      totals.total += amounts.total;
      return totals;
    }, { subtotal: 0, iva: 0, total: 0 });
  }

  function escapeHTML(value){
    return String(value).replace(/[&<>'"]/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    }[character]));
  }

  async function storageGet(key){
    if(window.storage && typeof window.storage.get === 'function') return window.storage.get(key, false);
    const value = window.localStorage.getItem('on-coffee-' + key);
    return value === null ? null : { value };
  }

  async function storageSet(key, value){
    if(window.storage && typeof window.storage.set === 'function') return window.storage.set(key, value, false);
    window.localStorage.setItem('on-coffee-' + key, value);
  }

  function milkLabel(id){
    const m = MILK_OPTIONS.find(x => x.id === id);
    return m ? m.label : null;
  }

  function temperatureLabel(id){
    const temperature = TEMPERATURE_OPTIONS.find(option => option.id === id);
    return temperature ? temperature.label : null;
  }

  function isBeverage(item){
    return BEVERAGE_CATEGORIES.includes(item.category);
  }

  function getUnitPrice(item, milkId){
    return item.price + (milkId === 'avena' ? OAT_MILK_EXTRA : 0);
  }

  async function loadMenu(){
    try{
      const verRes = await storageGet('menu-version');
      const storedVersion = verRes && verRes.value ? parseInt(verRes.value, 10) : 0;
      if(storedVersion < MENU_VERSION){
        menu = DEFAULT_MENU.slice();
        await saveMenu();
        await storageSet('menu-version', String(MENU_VERSION));
        return;
      }
      const res = await storageGet('menu-items');
      if(res && res.value){
        const savedMenu = JSON.parse(res.value);
        if(Array.isArray(savedMenu)){
          menu = savedMenu;
          return;
        }
      }
    }catch(e){  }
    menu = DEFAULT_MENU.slice();
    await saveMenu();
    try{ await storageSet('menu-version', String(MENU_VERSION)); }catch(e){}
  }

  async function saveMenu(){
    try{
      await storageSet('menu-items', JSON.stringify(menu));
    }catch(e){ console.error('No se pudo guardar el menú', e); }
  }

  function uid(){
    return 'item_' + Math.random().toString(36).slice(2, 9);
  }

  function categoryOptionsHTML(selected){
    return CATEGORIES.map(c => `<option value="${c.id}" ${c.id === selected ? 'selected' : ''}>${c.label}</option>`).join('');
  }

  function itemQtyTotal(itemId){
    return Object.keys(order)
      .filter(k => k.startsWith(itemId + '::'))
      .reduce((sum, k) => sum + order[k], 0);
  }

  function renderItemBtn(item){
    const btn = document.createElement('div');
    btn.className = 'item-btn' + (editMode ? ' editing' : '');

    if(editMode){
      btn.innerHTML = `
        <button class="del-btn" data-del="${item.id}">✕</button>
        <div class="edit-row">
          <input type="text" value="${escapeHTML(item.name)}" data-field="name" data-id="${item.id}" />
        </div>
        <div class="edit-row">
          <input type="number" value="${item.price}" min="0" step="0.5" data-field="price" data-id="${item.id}" />
        </div>
        <div class="edit-row">
          <select data-field="category" data-id="${item.id}">${categoryOptionsHTML(item.category)}</select>
        </div>
      `;
    } else {
      const qty = itemQtyTotal(item.id);
      btn.innerHTML = `
        ${qty > 0 ? `<div class="qty-badge">${qty}</div>` : ''}
        <div class="item-name">${escapeHTML(item.name)}</div>
        <div class="item-price">${fmt(item.price)}</div>
      `;
      btn.addEventListener('click', () => {
        if(isBeverage(item)){
          openDrinkModal(item);
        } else {
          const key = item.id + '::none';
          order[key] = (order[key] || 0) + 1;
          renderMenu();
          renderOrder();
        }
      });
    }
    return btn;
  }

  function renderMenu(){
    menuScroll.innerHTML = '';

    CATEGORIES.forEach(cat => {
      const items = menu.filter(m => (m.category || 'extras') === cat.id);
      const block = document.createElement('div');
      block.className = 'category-block';

      const title = document.createElement('div');
      title.className = 'category-title';
      title.innerHTML = `<span class="icon">${cat.icon}</span><h3>${cat.label}</h3><span class="count">${items.length}</span>`;
      block.appendChild(title);

      if(items.length === 0 && !editMode){
        const empty = document.createElement('div');
        empty.className = 'category-empty';
        empty.textContent = 'Aún no hay productos en esta sección.';
        block.appendChild(empty);
      } else {
        const grid = document.createElement('div');
        grid.className = 'menu-grid';
        items.forEach(item => grid.appendChild(renderItemBtn(item)));

        if(editMode){
          const addCard = document.createElement('div');
          addCard.className = 'add-item-card';
          addCard.innerHTML = `
            <input type="text" placeholder="Nombre del producto" class="newItemName" />
            <input type="number" placeholder="Precio" class="newItemPrice" min="0" step="0.5" />
            <button class="addItemBtn" data-cat="${cat.id}">Agregar a ${cat.label.toLowerCase()}</button>
          `;
          grid.appendChild(addCard);
        }

        block.appendChild(grid);
      }
      menuScroll.appendChild(block);
    });

    if(editMode){
      menuScroll.querySelectorAll('[data-field="name"]').forEach(input => {
        input.addEventListener('change', e => {
          const it = menu.find(m => m.id === e.target.dataset.id);
          if(it){ it.name = e.target.value.trim() || it.name; saveMenu(); }
        });
      });
      menuScroll.querySelectorAll('[data-field="price"]').forEach(input => {
        input.addEventListener('change', e => {
          const it = menu.find(m => m.id === e.target.dataset.id);
          if(it){ it.price = parseFloat(e.target.value) || 0; saveMenu(); renderOrder(); }
        });
      });
      menuScroll.querySelectorAll('[data-field="category"]').forEach(sel => {
        sel.addEventListener('change', e => {
          const it = menu.find(m => m.id === e.target.dataset.id);
          if(it){ it.category = e.target.value; saveMenu(); renderMenu(); }
        });
      });
      menuScroll.querySelectorAll('[data-del]').forEach(btn => {
        btn.addEventListener('click', e => {
          const id = e.target.dataset.del;
          menu = menu.filter(m => m.id !== id);
          Object.keys(order).forEach(k => { if(k.startsWith(id + '::')) delete order[k]; });
          saveMenu();
          renderMenu();
          renderOrder();
        });
      });
      menuScroll.querySelectorAll('.addItemBtn').forEach(btn => {
        btn.addEventListener('click', e => {
          const card = e.target.closest('.add-item-card');
          const nameEl = card.querySelector('.newItemName');
          const priceEl = card.querySelector('.newItemPrice');
          const name = nameEl.value.trim();
          const price = parseFloat(priceEl.value) || 0;
          const category = e.target.dataset.cat;
          if(!name) { nameEl.focus(); return; }
          menu.push({ id: uid(), name, price, category });
          saveMenu();
          renderMenu();
        });
      });
    }
  }

  function openDrinkModal(item){
    pendingItem = item;
    pendingMilk = item.hasMilk ? 'entera' : 'none';
    pendingTemperature = 'caliente';
    pendingQty = 1;
    modalItemName.textContent = item.name;
    updateMilkModalPrice();
    modalQtyValue.textContent = pendingQty;
    renderMilkChips();
    renderTemperatureChips();
    milkOverlay.classList.add('open');
  }

  function updateMilkModalPrice(){
    if(!pendingItem) return;
    modalItemPrice.textContent = fmt(getUnitPrice(pendingItem, pendingMilk)) +
      (pendingMilk === 'avena' ? ' (incluye $20 extra)' : '');
  }

  function closeMilkModal(){
    milkOverlay.classList.remove('open');
    pendingItem = null;
  }

  function renderMilkChips(){
    milkOptions.hidden = !pendingItem.hasMilk;
    if(!pendingItem.hasMilk) return;
    milkChips.innerHTML = MILK_OPTIONS.map(m =>
      `<button class="option-chip ${m.id === pendingMilk ? 'selected' : ''}" data-milk="${m.id}">${m.label}</button>`
    ).join('');
    milkChips.querySelectorAll('.option-chip').forEach(btn => {
      btn.addEventListener('click', e => {
        pendingMilk = e.target.dataset.milk;
        updateMilkModalPrice();
        renderMilkChips();
      });
    });
  }

  function renderTemperatureChips(){
    temperatureChips.innerHTML = TEMPERATURE_OPTIONS.map(option =>
      `<button class="option-chip ${option.id === pendingTemperature ? 'selected' : ''}" data-temperature="${option.id}">${option.label}</button>`
    ).join('');
    temperatureChips.querySelectorAll('.option-chip').forEach(btn => {
      btn.addEventListener('click', e => {
        pendingTemperature = e.target.dataset.temperature;
        renderTemperatureChips();
      });
    });
  }

  document.getElementById('modalQtyMinus').addEventListener('click', () => {
    if(pendingQty > 1){ pendingQty--; modalQtyValue.textContent = pendingQty; }
  });
  document.getElementById('modalQtyPlus').addEventListener('click', () => {
    pendingQty++; modalQtyValue.textContent = pendingQty;
  });
  document.getElementById('modalCancel').addEventListener('click', closeMilkModal);
  document.getElementById('modalConfirm').addEventListener('click', () => {
    if(!pendingItem) return;
    const key = pendingItem.id + '::' + pendingMilk + '::' + pendingTemperature;
    order[key] = (order[key] || 0) + pendingQty;
    closeMilkModal();
    renderMenu();
    renderOrder();
    updateCurrentSavedSale();
  });
  milkOverlay.addEventListener('click', e => {
    if(e.target.id === 'milkOverlay') closeMilkModal();
  });

  function changeQty(key, delta){
    if(!order[key]) return;
    order[key] += delta;
    if(order[key] <= 0) delete order[key];
    renderMenu();
    renderOrder();
    if(activeSaleId && Object.keys(order).length > 0){
      updateCurrentSavedSale();
    }
  }

  function renderOrder(){
    const keys = Object.keys(order);
    if(keys.length === 0){
      orderList.innerHTML = '<div class="empty-order">Toca un producto del menú<br>para agregarlo al pedido</div>';
      subtotalAmount.textContent = fmt(0);
      ivaAmount.textContent = fmt(0);
      totalAmount.textContent = fmt(0);
      newOrderBtn.disabled = true;
      printBtn.disabled = true;
      return;
    }
    const pricedLines = [];
    orderList.innerHTML = '';
    keys.forEach(key => {
      const [itemId, milkId, temperatureId] = key.split('::');
      const item = menu.find(m => m.id === itemId);
      if(!item) return;
      const qty = order[key];
      const unitPrice = getUnitPrice(item, milkId);
      const lineTotal = unitPrice * qty;
      pricedLines.push({ item, amount: lineTotal });
      const milk = milkId !== 'none' ? milkLabel(milkId) : null;
      const temperature = temperatureLabel(temperatureId);
      const row = document.createElement('div');
      row.className = 'order-line';
      row.innerHTML = `
        <div class="order-line-name">
          ${escapeHTML(item.name)}
          ${temperature || milk ? `<br><span class="order-line-milk">${[temperature, milk].filter(Boolean).join(' · ')}</span>` : ''}
          <span class="order-line-price">${fmt(unitPrice)} c/u</span>
        </div>
        <div class="stepper">
          <button data-minus="${key}">−</button>
          <span>${qty}</span>
          <button data-plus="${key}">+</button>
        </div>
        <div class="line-total">${fmt(lineTotal)}</div>
      `;
      orderList.appendChild(row);
    });
    orderList.querySelectorAll('[data-minus]').forEach(b => b.addEventListener('click', e => changeQty(e.target.dataset.minus, -1)));
    orderList.querySelectorAll('[data-plus]').forEach(b => b.addEventListener('click', e => changeQty(e.target.dataset.plus, 1)));

    const totals = calculateOrderTotals(pricedLines);
    subtotalAmount.textContent = fmt(totals.subtotal);
    ivaAmount.textContent = fmt(totals.iva);
    totalAmount.textContent = fmt(totals.total);
    newOrderBtn.disabled = false;
    printBtn.disabled = saleLoggedForOrder;
  }

  newOrderBtn.addEventListener('click', () => {
    if(Object.keys(order).length > 0){
      saveSale({ status: 'cancelado', reason: 'Pedido borrado' });
    }
    order = {};
    saleLoggedForOrder = false;
    activeSaleId = null;
    renderMenu();
    renderOrder();
  });

  function getCurrentOrderData(){
    const lines = [];
    const pricedLines = [];
    Object.keys(order).forEach(key => {
      const [itemId, milkId, temperatureId] = key.split('::');
      const item = menu.find(m => m.id === itemId);
      if(!item) return;
      const qty = order[key];
      const unitPrice = getUnitPrice(item, milkId);
      const lineTotal = unitPrice * qty;
      pricedLines.push({ item, amount: lineTotal });
      lines.push({
        name: item.name,
        qty,
        milk: milkId !== 'none' ? milkLabel(milkId) : '',
        temperature: temperatureLabel(temperatureId) || '',
        price: unitPrice,
        lineTotal
      });
    });
    const totals = calculateOrderTotals(pricedLines);
    return { lines, subtotal: totals.subtotal, iva: totals.iva, total: totals.total };
  }

  function buildReceiptHTML(mode){
    const now = new Date();
    const fecha = now.toLocaleDateString('es-MX') + ' ' + now.toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
    const data = getCurrentOrderData();
    function lineOptions(line){
      return [line.temperature, line.milk].filter(Boolean).join(', ');
    }
    const customerLinesHtml = data.lines.map(line => {
      return `
        <div class="r-line">
          <span class="r-name">${line.qty} x ${escapeHTML(line.name)}${lineOptions(line) ? ' (' + escapeHTML(lineOptions(line)) + ')' : ''}</span>
          <span>${fmt(line.lineTotal)}</span>
        </div>`;
    }).join('');
    const baristaLinesHtml = data.lines.map(line => `
        <div class="r-line">
          <span class="r-name">${line.qty} x ${escapeHTML(line.name)}${lineOptions(line) ? ' (' + escapeHTML(lineOptions(line)) + ')' : ''}</span>
        </div>`).join('');
    const baristaHTML = `
        <div class="r-brand"><img src="${LOGO_SRC}" alt="On Coffee"></div>
        <div class="r-shop">COMANDA BARISTA</div>
        <div class="r-meta">${fecha}</div>
        <hr/>${baristaLinesHtml}<hr/>
        <div class="r-foot">Preparar pedido</div>`;
    const customerHTML = `
      <div class="r-brand"><img src="${LOGO_SRC}" alt="On Coffee"></div>
      <div class="r-shop">On Coffee</div>
      <div class="r-meta">${fecha}</div>
      <hr/>
      ${customerLinesHtml}
      <hr/>
      <div class="r-summary"><span>Subtotal</span><span>${fmt(data.subtotal)}</span></div>
      <div class="r-summary"><span>IVA (8%)</span><span>${fmt(data.iva)}</span></div>
      <div class="r-total"><span>TOTAL</span><span>${fmt(data.total)}</span></div>
      <div class="r-foot">¡Gracias por tu compra!</div>
    `;
    return mode === 'barista' ? baristaHTML : mode === 'both'
      ? customerHTML + '<div class="r-barista">' + baristaHTML + '</div>'
      : customerHTML;
  }

  function loadSales(){
    try{
      const saved = JSON.parse(localStorage.getItem('on-coffee-' + SALES_KEY) || '[]');
      return Array.isArray(saved) ? saved : [];
    }catch(e){ return []; }
  }

  function saveSale({ status = 'vendido', reason = '' } = {}){
    if(Object.keys(order).length === 0 && status !== 'cancelado') return null;

    const data = getCurrentOrderData();
    const sales = loadSales();
    const timestamp = new Date().toISOString();
    const baseRecord = {
      id: activeSaleId || `sale_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
      timestamp,
      status,
      reason,
      lines: data.lines,
      subtotal: data.subtotal,
      iva: data.iva,
      total: data.total
    };

    const existingIndex = sales.findIndex(sale => sale.id === baseRecord.id);
    if(existingIndex >= 0){
      sales[existingIndex] = { ...sales[existingIndex], ...baseRecord, updatedAt: timestamp };
    }else{
      sales.push(baseRecord);
    }

    localStorage.setItem('on-coffee-' + SALES_KEY, JSON.stringify(sales));

    if(status === 'cancelado'){
      activeSaleId = null;
    }else{
      activeSaleId = baseRecord.id;
      saleLoggedForOrder = true;
    }

    return baseRecord;
  }

  function updateCurrentSavedSale(){
    if(!activeSaleId || Object.keys(order).length === 0) return;
    saveSale({ status: 'vendido', reason: '' });
  }

  let receiptPrinterName = null;

  function escPosSafeText(value){
    return String(value)
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\x20-\x7E]/g, '');
  }

  function buildEscPosReceipt(data){
    const ESC = '\x1B';
    const GS = '\x1D';
    const fullCut = GS + 'V' + '0';
    const width = 42;
    const divider = '-'.repeat(width);
    const date = new Date().toLocaleDateString('es-MX') + ' ' +
      new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
    let receiptText = ' '.repeat(Math.floor((width - 9) / 2)) + 'ON COFFEE\n';

    function line(label, value){
      const safeLabel = escPosSafeText(label);
      const safeValue = escPosSafeText(value);
      const spaces = Math.max(1, width - safeLabel.length - safeValue.length);
      receiptText += safeLabel + ' '.repeat(spaces) + safeValue + '\n';
    }

    function itemDescription(item){
      const options = [item.temperature, item.milk].filter(Boolean).join(', ');
      return `${item.qty} x ${item.name}${options ? ' (' + options + ')' : ''}`;
    }

    receiptText += ESC + 'E' + '\x00' + escPosSafeText(date) + '\n' + divider + '\n';
    receiptText += ESC + 'a' + '\x00';
    data.lines.forEach(item => {
      receiptText += escPosSafeText(itemDescription(item)) + '\n';
      receiptText += '  ' + escPosSafeText(fmt(item.lineTotal)) + '\n';
    });
    receiptText += divider + '\n';
    line('Subtotal', fmt(data.subtotal));
    line('IVA (8%)', fmt(data.iva));
    receiptText += ESC + 'E' + '\x01';
    line('TOTAL', fmt(data.total));
    receiptText += ESC + 'E' + '\x00' + '\n';
    receiptText += ESC + 'a' + '\x01' + 'Gracias por tu compra!\n\n\n' + fullCut;
    receiptText += ESC + 'E' + '\x01' + 'COMANDA BARISTA\n';
    receiptText += ESC + 'E' + '\x00' + escPosSafeText(date) + '\n' + divider + '\n';
    receiptText += ESC + 'a' + '\x00';
    data.lines.forEach(item => {
      receiptText += escPosSafeText(itemDescription(item)) + '\n';
    });
    return receiptText + '\n\n\n' + fullCut;
  }

  async function getReceiptPrinter(){
    if(typeof qz === 'undefined'){
      throw new Error('No se pudo cargar QZ Tray. Revisa tu conexión a internet y vuelve a abrir la página.');
    }
    if(!qz.websocket.isActive()){
      await qz.websocket.connect();
    }

    const printers = await qz.printers.find();
    if(!printers.length){
      throw new Error('QZ Tray no encontró impresoras. Revisa que la Nextep esté encendida y conectada al Mac.');
    }
    if(receiptPrinterName && printers.includes(receiptPrinterName)){
      return receiptPrinterName;
    }

    const matches = printers.filter(name => /nextep|ne[\s_-]?510x/i.test(name));
    if(matches.length === 1){
      receiptPrinterName = matches[0];
      return receiptPrinterName;
    }

    const choices = matches.length ? matches : printers;
    const selection = window.prompt(
      'Escribe el número de la impresora Nextep:\n' +
      choices.map((name, index) => `${index + 1}. ${name}`).join('\n'),
      '1'
    );
    const selectedIndex = Number(selection) - 1;
    if(selection === null || !Number.isInteger(selectedIndex) || !choices[selectedIndex]){
      throw new Error('No se seleccionó una impresora válida.');
    }
    receiptPrinterName = choices[selectedIndex];
    return receiptPrinterName;
  }

  printBtn.addEventListener('click', async () => {
    if(Object.keys(order).length === 0 || saleLoggedForOrder) return;
    const data = getCurrentOrderData();
    saveSale({ status: 'vendido', reason: 'Compra pagada' });
    renderOrder();
    try{
      const printer = await getReceiptPrinter();
      const config = qz.configs.create(printer);
      const commands = buildEscPosReceipt(data);
      await qz.print(config, [{
        type: 'raw',
        format: 'command',
        flavor: 'plain',
        data: commands
      }]);
      order = {};
      activeSaleId = null;
      saleLoggedForOrder = false;
      renderMenu();
      renderOrder();
    }catch(error){
      saleLoggedForOrder = false;
      renderOrder();
      console.error('Error al imprimir el ticket ESC/POS:', error);
      alert('No se pudo imprimir el ticket. El pedido sigue en pantalla para que puedas reintentar.\n\n' +
        (error && error.message ? error.message : String(error)));
    }
  });

  function csvCell(value){
    return '"' + String(value).replace(/"/g, '""') + '"';
  }

  function localDateKey(date){
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  reportBtn.addEventListener('click', () => {
    const today = new Date();
    const day = localDateKey(today);
    const sales = loadSales().filter(sale => {
      const date = new Date(sale.timestamp);
      return localDateKey(date) === day && date.getHours() >= 7 && date.getHours() < 24;
    }).sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

    const vendidos = sales.filter(sale => sale.status !== 'cancelado');
    const borrados = sales.filter(sale => sale.status === 'cancelado');
    const subtotalVendidos = vendidos.reduce((sum, sale) => sum + Number(sale.subtotal || 0), 0);
    const ivaVendidos = vendidos.reduce((sum, sale) => sum + Number(sale.iva || 0), 0);
    const totalVendidos = vendidos.reduce((sum, sale) => sum + Number(sale.total || 0), 0);
    const totalBorrados = borrados.reduce((sum, sale) => sum + Number(sale.total || 0), 0);

    const summaryRows = [
      ['Fecha', day],
      ['Ventas realizadas', vendidos.length],
      ['Pedidos borrados', borrados.length],
      ['Subtotal vendido', subtotalVendidos.toFixed(2)],
      ['IVA vendido', ivaVendidos.toFixed(2)],
      ['Total vendido', totalVendidos.toFixed(2)],
      ['Total borrados', totalBorrados.toFixed(2)],
      ['Gran total neto', (totalVendidos - totalBorrados).toFixed(2)]
    ];

    const detailRows = [['Fecha', 'Hora', 'Estado', 'Producto', 'Temperatura', 'Leche', 'Cantidad', 'Precio unitario', 'Subtotal venta', 'IVA 8%', 'Total venta', 'Motivo']];
    sales.forEach(sale => {
      const date = new Date(sale.timestamp);
      const status = sale.status === 'cancelado' ? 'Borrado' : 'Vendido';
      const reason = sale.reason || '';

      if(!sale.lines || sale.lines.length === 0){
        detailRows.push([
          date.toLocaleDateString('es-MX'),
          date.toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'}),
          status,
          'Pedido',
          '',
          '',
          '',
          '',
          '0.00',
          '0.00',
          '0.00',
          reason
        ]);
        return;
      }

      sale.lines.forEach(line => detailRows.push([
        date.toLocaleDateString('es-MX'),
        date.toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'}),
        status,
        line.name,
        line.temperature || 'No aplica',
        line.milk || 'No aplica',
        line.qty,
        Number(line.price).toFixed(2),
        Number(sale.subtotal || 0).toFixed(2),
        Number(sale.iva || 0).toFixed(2),
        Number(sale.total || 0).toFixed(2),
        reason
      ]));
    });

    const exportContent = [
      ['Resumen del día'],
      [],
      ...summaryRows,
      [],
      ['Detalle'],
      [],
      ...detailRows
    ];

    const csv = '\ufeff' + exportContent.map(row => row.map(csvCell).join(',')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `reporte-on-coffee-${day}.csv`;
    link.click();
    URL.revokeObjectURL(link.href);
  });

  editToggle.addEventListener('click', () => {
    editMode = !editMode;
    editToggle.classList.toggle('active', editMode);
    editToggle.textContent = editMode ? 'Listo' : 'Editar menú';
    renderMenu();
  });

  (async function init(){
    await loadMenu();
    renderMenu();
    renderOrder();
  })();
})();
</script>
